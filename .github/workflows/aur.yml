name: aur

# Publishes a release to the AUR package "auren": packaging/arch/PKGBUILD with the release's version and
# the checksum of GitHub's source tarball for its tag, and the .SRCINFO the AUR needs.
# Needs the secret AUR_SSH_KEY: a private key whose public half is on the AUR account that owns the
# package (see docs/releases.md). Run it by hand for a release that wasn't published (Actions → aur).

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, like v0.1.6"
        required: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - run: pacman -Syu --noconfirm --needed git openssh
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}       # the tag, never a branch of the same name
          persist-credentials: false
      - name: Fill in the version and checksum
        run: |
          # The PKGBUILD from this tag; the tarball GitHub serves for the same tag
          version="${TAG#v}"
          grep -q "^version = \"$version\"$" pyproject.toml || { echo "pyproject.toml isn't version $version"; exit 1; }
          curl -fsSL -o /tmp/source.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/$TAG.tar.gz"
          sum=$(sha256sum /tmp/source.tar.gz | cut -d' ' -f1)
          mkdir /tmp/aur-out
          sed -e "s/^pkgver=.*/pkgver=$version/" -e "s/^pkgrel=.*/pkgrel=1/" -e "s/^sha256sums=.*/sha256sums=('$sum')/" \
            packaging/arch/PKGBUILD >/tmp/aur-out/PKGBUILD
          cp packaging/arch/auren.install /tmp/aur-out/
          useradd -m builder
          chown -R builder /tmp/aur-out
          su builder -c "cd /tmp/aur-out && makepkg --printsrcinfo >.SRCINFO"
          cat /tmp/aur-out/PKGBUILD /tmp/aur-out/.SRCINFO
      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          [ -n "$AUR_SSH_KEY" ] || { echo "The AUR_SSH_KEY secret isn't set: see docs/releases.md"; exit 1; }
          # Explicit paths: in a container job HOME isn't the home ssh looks in.
          keys=$(mktemp -d)
          printf '%s\n' "$AUR_SSH_KEY" >"$keys/aur"
          chmod 600 "$keys/aur"
          # aur.archlinux.org's ed25519 key, as published on its front page (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4)
          echo "aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN" >"$keys/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $keys/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$keys/known_hosts -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/auren.git /tmp/aur
          cp /tmp/aur-out/PKGBUILD /tmp/aur-out/auren.install /tmp/aur-out/.SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name "kvm404"
          git config user.email "kvm404@users.noreply.github.com"
          git add PKGBUILD auren.install .SRCINFO
          if git diff --cached --quiet; then echo "the AUR already has this"; exit 0; fi
          git commit -m "auren ${TAG#v}"
          git push origin HEAD:master
