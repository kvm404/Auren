name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  mascot-drag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qt6-qpa-plugins qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qttest
      - run: /usr/lib/qt6/bin/qmltestrunner -input tests/mascot
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - run: python3 tests/test_mascot_bubble.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: bash -n install-macos.sh
      - run: uv run pytest -q tests/test_mac.py
      - run: uv run python tests/mac_smoke.py
      # The Homebrew formula, installed from this commit the way the tap installs a release: a tarball laid
      # out like GitHub's, in a local tap (brew installs formulae only from taps). Not set up: auren setup
      # would install Auren.app and launch agents. HOMEBREW_NO_INSTALL_FROM_API stays unset: a local tap
      # works with it, and uv comes from homebrew/core's API without cloning homebrew/core.
      - name: Install the Homebrew formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          tarball="$RUNNER_TEMP/auren-$version.tar.gz"
          git archive --format=tar.gz --prefix="Auren-$version/" -o "$tarball" HEAD
          sum=$(shasum -a 256 "$tarball" | cut -d' ' -f1)
          brew tap-new --no-git local/auren-ci
          formula="$(brew --repository local/auren-ci)/Formula/auren-macos.rb"
          mkdir -p "$(dirname "$formula")"
          sed -e "s#^  url \".*\"\$#  url \"file://$tarball\"#" -e "s#^  sha256 \".*\"\$#  sha256 \"$sum\"#" \
            packaging/homebrew/auren-macos.rb >"$formula"
          grep -qF "  sha256 \"$sum\"" "$formula"
          brew install --formula local/auren-ci/auren-macos
          brew test local/auren-ci/auren-macos
          # Brew's auren on PATH, for a user who hasn't run auren setup (a home of its own)
          home="$RUNNER_TEMP/brew-home"
          mkdir -p "$home"
          for cmd in auren auren-ctl; do
            if out=$(env -u XDG_DATA_HOME HOME="$home" "$(brew --prefix)/bin/$cmd" status 2>&1); then
              echo "$cmd ran without auren setup: $out"; exit 1
            fi
            [[ $out == "Auren isn't set up yet: run auren setup" ]] || { echo "$cmd said: $out"; exit 1; }
          done
          test -f "$(brew --prefix local/auren-ci/auren-macos)/libexec/source/install-macos.sh"
          test -f "$(brew --prefix local/auren-ci/auren-macos)/libexec/source/README.md"   # Homebrew moves it out of libexec itself
          # What auren setup builds first: Auren's environment from Homebrew's copy of the source (not the
          # rest of the setup: Auren.app and the launch agents are the user's)
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/brew-venv" uv sync --project "$(brew --prefix local/auren-ci/auren-macos)/libexec/source" \
            --frozen --no-dev --no-editable
          "$RUNNER_TEMP/brew-venv/bin/python" -I -c 'import auren.cli, auren.daemon, auren.phone_server'
      - name: Check the formula's style
        run: brew style --formula local/auren-ci/auren-macos
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"

  # The Homebrew formula's rename from auren (0.1.8) to auren-macos, on real Homebrew: a 0.1.8 install
  # gets across with the one brew trust command docs/macos.md gives (tests/brew_rename.sh).
  brew-rename:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew update --quiet       # brew trust is Homebrew 6.0.0 or newer
      - run: tests/brew_rename.sh
        env:
          HOMEBREW_NO_ANALYTICS: "1"

  # The Arch package, built from this commit the way the AUR builds a release, installed in a clean Arch,
  # then set up and removed for a user (no systemd user session or Omarchy here: setup says so and goes on).
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git uv python namcap hyprland quickshell pipewire pipewire-audio wireplumber grim wtype wl-clipboard libnotify gum
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "git config --global --add safe.directory '$GITHUB_WORKSPACE' && cd '$GITHUB_WORKSPACE' && packaging/arch/build-local.sh /tmp/pkg"
      - name: Install
        run: |
          namcap /tmp/pkg/auren-*.pkg.tar.zst || true
          pacman -U --noconfirm /tmp/pkg/auren-*.pkg.tar.zst
      - name: Set up and remove for a user
        run: |
          su builder -c '
            set -e
            auren --help >/dev/null
            mkdir -p ~/.config/hypr ~/.local/share/auren/models
            echo "-- keys" > ~/.config/hypr/bindings.lua
            AUREN_SKIP_VOICE_MODEL=1 auren setup --yes --keys=super --no-browser </dev/null
            test "$(readlink ~/.local/share/auren/bin/auren-ctl)" = /usr/bin/auren-ctl
            test "$(readlink ~/.local/share/auren/mascot)" = /usr/share/auren/mascot
            grep -q "Auren: talk" ~/.config/hypr/bindings.lua
            auren setup --remove --yes </dev/null
            ! grep -q "Auren" ~/.config/hypr/bindings.lua
          '
          pacman -R --noconfirm auren

  # The phone app: it builds, and its unit tests pass. Without Phonon's library (android/native/build-phonon.sh,
  # built for releases only) the app reads replies with Android's own voice, which is fine here.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v4     # gradle-wrapper.jar is Gradle's own
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

  # The full phone app, to try a PR on a real phone: Phonon's library (Auren's own voice), signed with the
  # release key, so the real release later installs over it. A download on the run (auren-phone-test),
  # kept 14 days. Only for PRs from this repository: a fork's PR gets no secrets (and no key).
  android-apk:
    needs: android
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/cache@v4      # the same cache the release workflow uses
        with:
          path: |
            ~/.cache/auren-build
            ~/.cargo/bin/cargo-ndk
          key: phonon-${{ hashFiles('android/native/build-phonon.sh') }}
      - name: Build Phonon's library
        run: android/native/build-phonon.sh
      - name: The release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$ANDROID_KEYSTORE" ] || { echo "The ANDROID_KEYSTORE secret isn't set: see docs/releases.md"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d >"$RUNNER_TEMP/release.jks"
      - name: Build the app
        working-directory: android
        env:
          AUREN_KEYSTORE: ${{ runner.temp }}/release.jks
          AUREN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUREN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUREN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Check it
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          apk=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libptts_ffi.so' || { echo "the APK has no Phonon library"; exit 1; }
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)" verify --print-certs "$apk"
          mkdir out && cp "$apk" out/auren-phone-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: auren-phone-test
          path: out/auren-phone-test.apk
          retention-days: 14
