name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  mascot-drag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qt6-qpa-plugins qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qttest
      - run: /usr/lib/qt6/bin/qmltestrunner -input tests/mascot
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
      - run: python3 tests/test_mascot_bubble.py

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: bash -n install-macos.sh
      - run: uv run pytest -q tests/test_mac.py
      - run: uv run python tests/mac_smoke.py
