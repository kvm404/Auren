name: android-release

# Builds the phone app for a release and attaches it to that release: auren-phone-X.Y.Z.apk, signed with the
# app's release key, with Phonon's library (android/native/build-phonon.sh) so the phone speaks in Auren's
# own voice, and its SHA-256 next to it.
# Needs four secrets (see docs/releases.md): ANDROID_KEYSTORE (the keystore, base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Run it by hand for a release that wasn't published (Actions →
# android-release).

permissions:
  contents: write          # to attach the APK to the release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, like v0.1.7"
        required: true

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}       # the tag, never a branch of the same name
          persist-credentials: false
      - name: Check the version
        run: |
          grep -q "^version = \"${TAG#v}\"$" pyproject.toml || { echo "pyproject.toml isn't version ${TAG#v}"; exit 1; }
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # Phonon's library takes a while to build: kept between releases while its pins (in the script) stay.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/auren-build
            ~/.cargo/bin/cargo-ndk
          key: phonon-${{ hashFiles('android/native/build-phonon.sh') }}
      - name: Build Phonon's library
        run: android/native/build-phonon.sh
      - name: The release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$ANDROID_KEYSTORE" ] || { echo "The ANDROID_KEYSTORE secret isn't set: see docs/releases.md"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d >"$RUNNER_TEMP/release.jks"
      - name: Build the app
        working-directory: android
        env:
          AUREN_KEYSTORE: ${{ runner.temp }}/release.jks
          AUREN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUREN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUREN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease   # the unit tests run on the debug variant only
      - name: Check it
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "no signed APK (is the key right?)"; ls android/app/build/outputs/apk/release; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libptts_ffi.so' || { echo "the APK has no Phonon library"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir out
          cp "$apk" "out/auren-phone-${TAG#v}.apk"
          (cd out && sha256sum "auren-phone-${TAG#v}.apk" >"auren-phone-${TAG#v}.apk.sha256")
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
