[project]
name = "auren"
version = "0.1.5"
description = "Voice assistant for Omarchy and macOS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "evdev>=2.0.0; sys_platform == 'linux'",
    "mcp>=2.3.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "supertonic>=1.3.1",
    "tomlkit>=0.15.1",
    "websockets>=17.2",
    # macOS: the mic and speaker, the screen, mouse and keyboard, windows, and the mascot
    "sounddevice>=0.5.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11.1; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11.1; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=11.1; sys_platform == 'darwin'",
    "PySide6-Essentials>=6.9.1; sys_platform == 'darwin'",
]

[project.scripts]
auren = "auren.cli:main"
auren-ctl = "auren.ctl:main"
auren-profile = "auren.profile.cli:main"
auren-server = "auren.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auren"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E741", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
