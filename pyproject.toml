[project]
name = "auren"
version = "0.1.0"
description = "Voice assistant for an Omarchy/Hyprland laptop"
requires-python = ">=3.12"
dependencies = [
    "evdev>=2.0.0",
    "mcp>=2.3.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "supertonic>=1.3.1",
    "websockets>=17.2",
]

[project.scripts]
auren = "auren.cli:main"
auren-profile = "auren.profile.cli:main"
auren-server = "auren.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auren"]

[dependency-groups]
dev = ["pytest"]
